name: Keep Agent Awake 24/7

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance 15-minute spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Agent Health Endpoint
        run: |
          echo "Pinging https://agentclaw-cayj.onrender.com/api/status..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS: %{http_code}\n" https://agentclaw-cayj.onrender.com/api/status)
          echo "$RESPONSE"
