name: Keep Agent Awake 24/7

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance 15-minute spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Agent Health Endpoints (Railway & Render)
        run: |
          echo "Pinging Railway Agent Health Endpoint..."
          curl -s -w "\nHTTP_STATUS: %{http_code}\n" https://agentclaw-agent-production.up.railway.app/health
          echo "Pinging Render Agent Health Endpoint..."
          curl -s -w "\nHTTP_STATUS: %{http_code}\n" https://agentclaw-cayj.onrender.com/health

